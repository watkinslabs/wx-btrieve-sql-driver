[package]
name    = "wxbtrv-web"
version.workspace = true
edition.workspace = true
build   = "build.rs"

[[bin]]
name = "wxbtrv-web"
path = "src/main.rs"

[dependencies]
# axum + tokio for the HTTP server
axum            = "0.7"
tokio           = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http      = { version = "0.5", features = ["trace", "cors"] }
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# JSON, CLI, embedded UI
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
clap            = { workspace = true }
rust-embed      = { version = "8", features = ["interpolate-folder-path"] }
mime_guess      = "2"

# In-process reuse
wxbtrv-core     = { path = "../wxbtrv-core" }
db-config       = { path = "../db-config" }
btr-import      = { path = "../btr-import" }
btr-types.workspace = true
rusqlite.workspace  = true
odbc-api.workspace  = true
postgres            = "0.19"
futures-util        = "0.3"
async-stream        = "0.3"

# Open the system browser at startup
opener          = "0.7"
# OS-appropriate config dir for ~/.config/wxbtrv-web/recent.json
dirs            = "5"

# Native open/save/folder picker (talks to GTK/AppKit/Win32 via the
# server-side process; fine because the UI runs against localhost).
# Linux uses the xdg-portal feature (D-Bus to xdg-desktop-portal) so we
# don't drag in GTK; Windows + macOS use the default Win32 / AppKit
# backends which don't need any flags.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.14", default-features = false, features = ["xdg-portal", "tokio"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.14", features = ["tokio"] }
