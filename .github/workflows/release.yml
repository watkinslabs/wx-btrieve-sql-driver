name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: "patch"
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: "Dry run (no commit, tag, or release)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Bump, build, and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install build deps (mingw + nasm)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 nasm

      - name: Rust toolchain (stable + i686-pc-windows-gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: Compute new version
        id: bump
        run: |
          set -euo pipefail
          current=$(grep -E '^version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          IFS=. read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new="$major.$minor.$patch"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "new=$new"         >> "$GITHUB_OUTPUT"
          echo "tag=v$new"        >> "$GITHUB_OUTPUT"
          echo "Bumping $current -> $new"

      - name: Update version in workspace Cargo.toml
        run: |
          sed -i -E 's/^version = "[^"]+"/version = "${{ steps.bump.outputs.new }}"/' Cargo.toml
          # Refresh lockfile so the new version is recorded
          cargo update --workspace --offline 2>/dev/null || cargo generate-lockfile

      - name: Build wxbtrv.dll (i686 release)
        run: cargo build -p wxbtrv --release --target i686-pc-windows-gnu

      - name: Build wxbtrv.sys (DOS driver)
        run: make sys

      - name: Build Windows CLIs (db-config, btr-import, installer)
        run: |
          cargo build --release --target i686-pc-windows-gnu \
            -p db-config -p btr-import -p installer

      - name: Build native CLIs (Linux)
        run: cargo build --release -p db-config -p btr-import

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          WIN=target/i686-pc-windows-gnu/release
          NAT=target/release
          cp "$WIN/wxbtrv.dll"      dist/
          cp "$WIN/wxbtrv.sys"      dist/
          cp "$WIN/db_config.exe"   dist/
          cp "$WIN/btr-import.exe"  dist/
          cp "$WIN/installer.exe"   dist/
          cp "$NAT/db_config"       dist/db-config-linux
          cp "$NAT/btr-import"      dist/btr-import-linux
          (cd dist && sha256sum * > SHA256SUMS)
          ls -lh dist/

      - name: Commit version bump and tag
        if: ${{ !inputs.dry_run }}
        run: |
          git add Cargo.toml Cargo.lock
          git commit -m "Release ${{ steps.bump.outputs.tag }}"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          files: dist/*

      - name: Upload artifacts (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.bump.outputs.tag }}-dryrun
          path: dist/
