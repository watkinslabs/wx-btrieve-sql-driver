name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: "patch"
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: "Dry run (no commit, tag, or release)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Bump, build, and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install build deps (mingw + nasm + unixODBC)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 nasm unixodbc-dev

      - name: Rust toolchain (stable + i686-pc-windows-gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: Compute new version
        id: bump
        run: |
          set -euo pipefail
          current=$(grep -E '^version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          IFS=. read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new="$major.$minor.$patch"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "new=$new"         >> "$GITHUB_OUTPUT"
          echo "tag=v$new"        >> "$GITHUB_OUTPUT"
          echo "Bumping $current -> $new"

      - name: Update version in workspace Cargo.toml
        run: |
          sed -i -E 's/^version = "[^"]+"/version = "${{ steps.bump.outputs.new }}"/' Cargo.toml
          # Refresh lockfile so the new version is recorded
          cargo update --workspace --offline 2>/dev/null || cargo generate-lockfile

      - name: Build wxbtrv.dll (i686 release)
        run: cargo build -p wxbtrv --release --target i686-pc-windows-gnu

      - name: Build wxbtrv.sys (DOS driver)
        run: make sys

      - name: Build Windows db-config + btr-import
        run: |
          cargo build --release --target i686-pc-windows-gnu \
            -p db-config -p btr-import

      - name: Build native CLIs (Linux)
        run: cargo build --release -p db-config -p btr-import

      # Installer must build LAST and with payload env vars set so its
      # build.rs embeds the prebuilt DLL/sys/CLIs as include_bytes!.
      - name: Build Windows installer (with bundled payloads)
        env:
          WXBTRV_DLL: ${{ github.workspace }}/target/i686-pc-windows-gnu/release/wxbtrv.dll
          WXBTRV_SYS: ${{ github.workspace }}/target/i686-pc-windows-gnu/release/wxbtrv.sys
          INT_TOOL_EXE: ${{ github.workspace }}/target/i686-pc-windows-gnu/release/db_config.exe
          BTR_IMPORT_EXE: ${{ github.workspace }}/target/i686-pc-windows-gnu/release/btr-import.exe
        run: cargo build --release --target i686-pc-windows-gnu -p installer

      # Two shipped artifacts only:
      #   wlbtr-installer-${TAG}-windows-i686.exe — drops wxbtrv.dll, wxbtrv.sys,
      #     db_config.exe, btr-import.exe via embedded include_bytes!.
      #   wlbtr-tools-${TAG}-linux-x86_64.tar.gz  — db-config + btr-import
      #     standalone CLIs for managing wxbtrv.db on a Linux dev box.
      - name: Stage release artifacts
        run: |
          set -euo pipefail
          TAG="${{ steps.bump.outputs.tag }}"
          WIN=target/i686-pc-windows-gnu/release
          NAT=target/release
          mkdir -p dist staging-linux

          cp "$WIN/installer.exe" "dist/wlbtr-installer-${TAG}-windows-i686.exe"

          cp "$NAT/db_config"   "staging-linux/db-config"
          cp "$NAT/btr-import"  "staging-linux/btr-import"
          tar -C staging-linux -czf "dist/wlbtr-tools-${TAG}-linux-x86_64.tar.gz" db-config btr-import

          (cd dist && sha256sum * > SHA256SUMS)
          ls -lh dist/

      - name: Commit version bump and tag
        if: ${{ !inputs.dry_run }}
        run: |
          git add Cargo.toml Cargo.lock
          git commit -m "Release ${{ steps.bump.outputs.tag }}"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          files: dist/*

      - name: Upload artifacts (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.bump.outputs.tag }}-dryrun
          path: dist/
