name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: "patch"
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: "Dry run (no commit, tag, or release)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build the Windows wxbtrv-web binary in parallel — the main release
  # job (Linux) then downloads it as an artifact and bundles it.
  web-windows:
    name: Build wxbtrv-web (windows-x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/wxbtrv-web/ui/node_modules
          key: cargo-web-windows-${{ hashFiles('**/Cargo.lock', 'crates/wxbtrv-web/ui/package*.json') }}
          restore-keys: cargo-web-windows-
      - name: Build wxbtrv-web (release, embeds React UI)
        run: cargo build --release -p wxbtrv-web
      - name: Upload wxbtrv-web.exe
        uses: actions/upload-artifact@v4
        with:
          name: wxbtrv-web-windows-x86_64
          path: target/release/wxbtrv-web.exe

  release:
    name: Bump, build, and publish release
    needs: [web-windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install build deps (mingw + nasm + unixODBC + dbus for rfd)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 nasm unixodbc-dev libdbus-1-dev pkg-config

      - name: Set up Node (for wxbtrv-web UI bundle)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rust toolchain (stable + i686-pc-windows-gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: Compute new version
        id: bump
        run: |
          set -euo pipefail
          current=$(grep -E '^version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          IFS=. read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new="$major.$minor.$patch"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "new=$new"         >> "$GITHUB_OUTPUT"
          echo "tag=v$new"        >> "$GITHUB_OUTPUT"
          echo "Bumping $current -> $new"

      - name: Update version in workspace Cargo.toml
        run: |
          sed -i -E 's/^version = "[^"]+"/version = "${{ steps.bump.outputs.new }}"/' Cargo.toml
          # Refresh lockfile so the new version is recorded
          cargo update --workspace --offline 2>/dev/null || cargo generate-lockfile

      - name: Build wxbtrv.dll (i686 release)
        run: cargo build -p wxbtrv --release --target i686-pc-windows-gnu

      - name: Build wxbtrv.sys (DOS driver)
        run: make sys

      - name: Build Windows db-config + btr-import
        run: |
          cargo build --release --target i686-pc-windows-gnu \
            -p db-config -p btr-import

      - name: Build native CLIs (Linux)
        run: cargo build --release -p db-config -p btr-import

      - name: Build wxbtrv-web (Linux, embeds React UI)
        run: cargo build --release -p wxbtrv-web

      # Installer must build LAST and with payload env vars set so its
      # build.rs embeds the prebuilt DLL/sys/CLIs as include_bytes!.
      - name: Build Windows installer (with bundled payloads)
        env:
          WXBTRV_DLL: ${{ github.workspace }}/target/i686-pc-windows-gnu/release/wxbtrv.dll
          WXBTRV_SYS: ${{ github.workspace }}/target/i686-pc-windows-gnu/release/wxbtrv.sys
          INT_TOOL_EXE: ${{ github.workspace }}/target/i686-pc-windows-gnu/release/db_config.exe
          BTR_IMPORT_EXE: ${{ github.workspace }}/target/i686-pc-windows-gnu/release/btr-import.exe
        run: cargo build --release --target i686-pc-windows-gnu -p installer

      - name: Download Windows wxbtrv-web artifact
        uses: actions/download-artifact@v4
        with:
          name: wxbtrv-web-windows-x86_64
          path: web-windows

      # Four shipped artifacts:
      #   wlbtr-installer-${TAG}-windows-i686.exe — drops wxbtrv.dll, wxbtrv.sys,
      #     db_config.exe, btr-import.exe via embedded include_bytes!.
      #   wlbtr-tools-${TAG}-linux-x86_64.tar.gz  — db-config + btr-import
      #     standalone CLIs for managing wxbtrv.db on a Linux dev box.
      #   wxbtrv-web-${TAG}-linux-x86_64.tar.gz   — single-binary local web UI
      #     (React bundle is embedded via rust-embed).
      #   wxbtrv-web-${TAG}-windows-x86_64.zip    — same UI, Windows build
      #     produced by the parallel windows-latest job above.
      - name: Stage release artifacts
        run: |
          set -euo pipefail
          TAG="${{ steps.bump.outputs.tag }}"
          WIN=target/i686-pc-windows-gnu/release
          NAT=target/release
          mkdir -p dist staging-linux staging-web

          cp "$WIN/installer.exe" "dist/wlbtr-installer-${TAG}-windows-i686.exe"

          cp "$NAT/db_config"   "staging-linux/db-config"
          cp "$NAT/btr-import"  "staging-linux/btr-import"
          tar -C staging-linux -czf "dist/wlbtr-tools-${TAG}-linux-x86_64.tar.gz" db-config btr-import

          cp "$NAT/wxbtrv-web"  "staging-web/wxbtrv-web"
          tar -C staging-web -czf "dist/wxbtrv-web-${TAG}-linux-x86_64.tar.gz" wxbtrv-web

          (cd web-windows && zip -j "${GITHUB_WORKSPACE}/dist/wxbtrv-web-${TAG}-windows-x86_64.zip" wxbtrv-web.exe)

          (cd dist && sha256sum * > SHA256SUMS)
          ls -lh dist/

      - name: Commit version bump and tag
        if: ${{ !inputs.dry_run }}
        run: |
          git add Cargo.toml Cargo.lock
          git commit -m "Release ${{ steps.bump.outputs.tag }}"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          files: dist/*

      - name: Upload artifacts (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.bump.outputs.tag }}-dryrun
          path: dist/
