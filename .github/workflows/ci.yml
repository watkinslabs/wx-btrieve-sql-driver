name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Warnings are reported by the Lint job but do not block builds while
  # the wxbtrv-core split is still settling.

jobs:
  # ── Unit tests (host-native, no DB required) ─────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install unixODBC headers (for wxbtrv-core)
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-unit-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-unit-${{ runner.os }}-
      - name: cargo test -p wxbtrv-core --lib
        run: cargo test -p wxbtrv-core --lib

  # ── Integration tests against MSSQL ──────────────────────────────────────
  test-mssql:
    name: Integration (MSSQL)
    runs-on: ubuntu-22.04
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: WxTest!2024
          MSSQL_PID: Developer
        ports:
          - 1433:1433
    env:
      BTR_TEST_BACKEND: mssql
      BTR_TEST_SERVER: localhost,1433
      BTR_TEST_USER: sa
      BTR_TEST_PASS: WxTest!2024
    steps:
      - uses: actions/checkout@v4
      - name: Install ODBC Driver 17 for SQL Server
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17 unixodbc-dev mssql-tools
          echo 'export PATH="$PATH:/opt/mssql-tools/bin"' | sudo tee -a /etc/profile.d/mssql.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-mssql-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-mssql-${{ runner.os }}-
      - name: Wait for SQL Server
        run: |
          for i in {1..30}; do
            if /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$BTR_TEST_PASS" -Q "SELECT 1" -C > /dev/null 2>&1; then
              echo "SQL Server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server failed to become ready"; exit 1
      - name: Bootstrap fixture database
        run: |
          /opt/mssql-tools/bin/sqlcmd \
            -S localhost -U sa -P "$BTR_TEST_PASS" -C \
            -i crates/btr-test-harness/fixtures/schema.sql
      - name: Run integration tests
        run: cargo test -p btr-test-harness -- --test-threads=1

  # ── Integration tests against Postgres ───────────────────────────────────
  test-postgres:
    name: Integration (Postgres)
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: WxTest2024
          POSTGRES_DB: wxbtrv_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BTR_TEST_BACKEND: postgres
      BTR_PG_HOST: localhost
      BTR_PG_PORT: "15432"
      BTR_PG_USER: postgres
      BTR_PG_PASS: WxTest2024
      BTR_PG_DB: wxbtrv_test
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps (unixODBC for wxbtrv-core link)
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-pg-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-pg-${{ runner.os }}-
      - name: Run integration tests
        run: cargo test -p btr-test-harness -- --test-threads=1

  # ── Integration tests against SQLite (no service container needed) ──────
  test-sqlite:
    name: Integration (SQLite)
    runs-on: ubuntu-22.04
    env:
      BTR_TEST_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps (unixODBC for wxbtrv-core link)
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-sqlite-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-sqlite-${{ runner.os }}-
      - name: Run integration tests
        run: cargo test -p btr-test-harness -- --test-threads=1

  # ── Windows cross-build: production DLL ──────────────────────────────────
  cross-build-dll:
    name: Cross-build wxbtrv.dll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686
      - name: Rust toolchain (with i686-pc-windows-gnu target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-gnu
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-cross-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-cross-${{ runner.os }}-
      - name: Build wxbtrv.dll (release, i686)
        run: cargo build -p wxbtrv --release --target i686-pc-windows-gnu
      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: wxbtrv-dll-release
          path: target/i686-pc-windows-gnu/release/wxbtrv.dll

  # ── wxbtrv-web: builds the React UI bundle + Rust binary ────────────────
  build-web:
    name: Build wxbtrv-web (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wxbtrv-web-linux-x86_64
            bin: wxbtrv-web
          - os: windows-latest
            artifact: wxbtrv-web-windows-x86_64
            bin: wxbtrv-web.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps (unixODBC + dbus for rfd)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev libdbus-1-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/wxbtrv-web/ui/node_modules
          key: cargo-web-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock', 'crates/wxbtrv-web/ui/package*.json') }}
          restore-keys: cargo-web-${{ matrix.os }}-
      - name: Build wxbtrv-web (release, embeds React UI)
        run: cargo build --release -p wxbtrv-web
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.bin }}

  # ── Lint: format + clippy on host target ─────────────────────────────────
  lint:
    name: Format + Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install unixODBC headers
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - name: rustfmt --check
        run: cargo fmt --all -- --check
      - name: Clippy (wxbtrv-core, advisory)
        run: cargo clippy -p wxbtrv-core
        continue-on-error: true
